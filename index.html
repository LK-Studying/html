<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <h1>Các trường hợp cần sử dụng HTML entity</h1>
    <h2>1.Hiển thị các ký tự đặc biệt</h2>
    <p>	&copy;DK</p>
    <h2>2.Hiển thị các đoạn code, thứ bị trùng với quy ước ký tự của html</h2>
    <p>Làm thế nào để hiển thị tag h1?</p>
    <p>&#x3C;h1&#x3E;Toi la DK&#x3C;/h1&#x3E;</p>
</body>
</html>
