    <!-- Tuy giống nhưng border-radius khá là khác với padding:
     1. Nếu truyền vào 2 thông số
      +padding: Trên dưới - trái phải
      +border-radius: [Trên trái + dưới phải] - [trên phải + dưới trái], nói cách khác là đường chéo tính từ trên trái

     2. Nếu truyền vào 3 thông số 10px 20px 30px
      +padding: Trên - trái phải- dưới  
      +border-radius: Đầu tiên Trên trái 10px - 
                      thứ 2 là trên phải 20px
                      Thứ 3 là dưới phải 30px 
                      Thứ 4 là dưới trái 20px do là chéo của trên phải  -->
