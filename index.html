<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Học về Table</h1>
    <table>
      <thead>
        <tr>
          <th>Tên sản phẩm</th>
          <th>Giá</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Áo phông</td>
          <td>100.000 vnd</td>
        </tr>

        <tr>
          <td>Quần jean</td>
          <td>150.000 vnd</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td>Tổng cộng</td>
          <td>250.000 vnd</td>
        </tr>
      </tfoot>
    </table>

    <!-- Cấu trúc bảng như trên có những lợi ích sau:
     1.Tường minh hơn
     2.Hỗ trợ tốt hơn cho công cụ tìm kiếm
     3.Hỗ trợ trình đọc máy cho người khiếm thị
     -->
  </body>
</html>
